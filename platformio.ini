; PlatformIO Project Configuration File2
; http://docs.platformio.org/page/projectconf.html

[platformio]
include_dir = Inc
src_dir     = Src


default_envs = stm32
;default_envs = genericGD32F130C8

;=================== VARIANT SELECTION ==========================
;
; Choose one or all variants get built
;
;VARIANT_ADC         ; Variant for control via ADC input
;VARIANT_USART       ; Variant for Serial control via USART3 input
;VARIANT_NUNCHUK     ; Variant for Nunchuk controlled vehicle build
;VARIANT_PPM         ; Variant for RC-Remotes with PPM-Sum signal
;VARIANT_PWM         ; Variant for RC-Remotes with PWM signal
;VARIANT_IBUS        ; Variant for RC-Remotes with FLYSKY IBUS
;VARIANT_HOVERCAR    ; Variant for HOVERCAR build
;VARIANT_HOVERBOARD  ; Variant for HOVERBOARD
;VARIANT_TRANSPOTTER ; Variant for TRANSPOTTER build https://github.com/NiklasFauth/hoverboard-firmware-hack/wiki/Build-Instruction:-TranspOtter https://hackaday.io/project/161891-transpotter-ng
;VARIANT_SKATEBOARD  ; Variant for SKATEBOARD build controlled via RC-Remotes with PWM signal
;================================================================

[config]
variant = VARIANT_IBUS
build_flags_common =
    -D ${config.variant}

;================================================================

[env:stm32]
platform        = ststm32
framework       = stm32cube
board           = genericSTM32F103RC
debug_tool      = stlink
upload_protocol = stlink

; Serial Port settings (make sure the COM port is correct)
monitor_port    = COM5
monitor_speed   = 115200

build_src_filter =
    +<*>
    -<.git/>
    -<.svn/>
    -<Platform/*>
    +<Platform/Stm32>

build_flags =
    -D ${config.build_flags_common}

    -DUSE_HAL_DRIVER
    -DSTM32F103xE
    -T./STM32F103RCTx_FLASH.ld
    -I Inc/Platform/Stm32
    -lc
    -lm
    -g -ggdb        ; to generate correctly the 'firmware.elf' for STM STUDIO vizualization


[env:genericGD32F130C8]
platform = https://github.com/CommunityGD32Cores/platform-gd32.git
platform_packages = framework-spl-gd32@https://github.com/CommunityGD32Cores/gd32-pio-spl-package.git

framework = spl
board = genericGD32F130C8
debug_tool      = stlink
upload_protocol = stlink

monitor_port    = COM5
monitor_speed   = 19200

build_src_filter =
    +<*>
    -<.git/>
    -<.svn/>
    -<Platform/*>
    +<Platform/Gd32F130C8T6>

build_flags =
    -D ${config.build_flags_common}
    -D GD32F130
    -I Inc/Platform/Gd32F130C8T6
